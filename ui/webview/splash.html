<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSLS - Project Sertraline Lab Offline Security</title>
    <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 757px; height: 373px; overflow: hidden; }
:root {
  --brand-background: #0a0e14;
  --brand-foreground: #e8eaed;
  --brand-muted-foreground: #9aa0a6;
  --brand-primary: #1db954;
  --brand-border: rgba(255, 255, 255, 0.10);
}
body {
  font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  background: var(--brand-background);
  color: var(--brand-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.splash-container {
  width: 757px;
  height: 373px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
.splash-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #0a0e14 0%, #0d1520 40%, #0a1414 100%);
  z-index: 0;
}
.splash-bg::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 60%;
  height: 200%;
  background: radial-gradient(ellipse at center, rgba(29,185,84,0.06) 0%, transparent 70%);
  z-index: 0;
}
.splash-content {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 28px 36px 20px;
}
.splash-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 6px;
}
.splash-shield-icon {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(29,185,84,0.15) 0%, rgba(29,185,84,0.05) 100%);
  border-radius: 10px;
  border: 1px solid rgba(29,185,84,0.2);
  flex-shrink: 0;
}
.splash-shield-icon svg {
  width: 24px;
  height: 24px;
  color: #1db954;
}
.splash-title-group {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.splash-title {
  font-size: 16px;
  font-weight: 600;
  color: #e8eaed;
  letter-spacing: 0.01em;
  line-height: 1.2;
}
.splash-subtitle {
  font-size: 11px;
  font-weight: 400;
  color: #9aa0a6;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.splash-status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: auto;
  margin-bottom: 10px;
}
.splash-status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #1db954;
  flex-shrink: 0;
  animation: pulse-dot 2s ease-in-out infinite;
  box-shadow: 0 0 6px rgba(29,185,84,0.5);
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.splash-status-text {
  font-size: 12px;
  color: #9aa0a6;
  font-weight: 400;
}
.splash-progress-section {
  margin-top: 6px;
}
.splash-progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.splash-progress-label {
  font-size: 11px;
  color: #9aa0a6;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.splash-progress-pct {
  font-size: 11px;
  color: #1db954;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.splash-progress-track {
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.splash-progress-fill {
  height: 100%;
  border-radius: 2px;
  position: relative;
  transition: width 0.3s ease;
}
.splash-progress-fill-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, #1db954 0%, #17a34a 100%);
  border-radius: 2px;
}
.splash-progress-fill-glow {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(29,185,84,0.4));
  border-radius: 2px;
}
.splash-progress-scan-line {
  position: absolute;
  top: 0;
  height: 100%;
  width: 2px;
  background: rgba(255,255,255,0.5);
  animation: scan-line 2s ease-in-out infinite;
  border-radius: 1px;
}
@keyframes scan-line {
  0% { left: 0%; opacity: 0; }
  20% { opacity: 0.8; }
  80% { opacity: 0.8; }
  100% { left: 100%; opacity: 0; }
}
.splash-scroll-log {
  margin-top: 8px;
  flex: 1;
  overflow: hidden;
  position: relative;
  min-height: 120px;
  max-height: 140px;
}
.splash-scroll-log-inner {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding-right: 6px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.1) transparent;
}
.splash-scroll-log-inner::-webkit-scrollbar {
  width: 4px;
}
.splash-scroll-log-inner::-webkit-scrollbar-track {
  background: transparent;
}
.splash-scroll-log-inner::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
}
.splash-scroll-log-inner::-webkit-scrollbar-thumb:hover {
  background: rgba(255,255,255,0.18);
}
.splash-log-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-family: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
  font-size: 10.5px;
  line-height: 1.5;
}
.splash-log-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  color: #6b7280;
  padding: 1px 0;
}
.splash-log-item.completed {
  color: #5a7a6a;
}
.splash-log-item.active {
  color: #1db954;
}
.splash-log-time {
  color: #4a5568;
  flex-shrink: 0;
  width: 48px;
  font-variant-numeric: tabular-nums;
}
.splash-log-item.active .splash-log-time {
  color: #1db954;
}
.splash-log-icon {
  flex-shrink: 0;
  width: 14px;
  height: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
}
.splash-log-item.completed .splash-log-icon svg {
  color: #1db954;
}
.splash-log-item.active .splash-log-icon svg {
  color: #1db954;
}
.splash-log-path {
  flex: 1;
  word-break: break-all;
  overflow-wrap: anywhere;
}
.splash-footer {
  margin-top: auto;
  padding-top: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.splash-footer-left {
  font-size: 10px;
  color: #4a5568;
  font-weight: 400;
}
.splash-footer-right {
  font-size: 10px;
  color: #4a5568;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
}
@media (prefers-reduced-motion: reduce) {
  .splash-status-dot { animation: none; }
  .splash-progress-scan-line { animation: none; }
}
    </style>
</head>
<body>
    <main class="splash-container">
      <div class="splash-bg"></div>
      <div class="splash-content">
        <div class="splash-header">
          <div class="splash-shield-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="M9 12l2 2 4-4"/>
            </svg>
          </div>
          <div class="splash-title-group">
            <div class="splash-title">Project Sertraline Lab</div>
            <div class="splash-subtitle">Offline Security Suite</div>
          </div>
        </div>

        <div class="splash-status-row">
          <div class="splash-status-dot"></div>
          <div class="splash-status-text">正在初始化安全模块...</div>
        </div>

        <div class="splash-progress-section">
          <div class="splash-progress-header">
            <span class="splash-progress-label">扫描进度</span>
            <span class="splash-progress-pct" id="progress-pct">0%</span>
          </div>
          <div class="splash-progress-track">
            <div class="splash-progress-fill" id="progress-fill" style="width: 0%;">
              <div class="splash-progress-fill-bg"></div>
              <div class="splash-progress-fill-glow"></div>
            </div>
            <div class="splash-progress-scan-line" style="left: 0%;"></div>
          </div>
        </div>

        <div class="splash-scroll-log">
          <div class="splash-scroll-log-inner" id="scroll-log">
            <div class="splash-log-list" id="log-list"></div>
          </div>
        </div>

        <div class="splash-footer">
          <span class="splash-footer-left" id="footer-left">PSLS V26.2.0beta · 内核防护待激活</span>
          <span class="splash-footer-right" id="footer-time">--:--:--</span>
        </div>
      </div>
    </main>
    <script>
      const CHECK = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg>';
      const ACTIVE = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="12" cy="12" r="3"/></svg>';
      const PENDING = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="12" cy="12" r="1"/></svg>';

      // 初始化阶段（与 PSLS 真实启动模块对齐）
      const phases = [
        { pct: 5,  text: '已初始化安全引擎核心' },
        { pct: 15, text: '正在加载内核驱动 PSLS.sys' },
        { pct: 28, text: '正在验证签名数据库' },
        { pct: 40, text: '正在加载扫描引擎模块' },
        { pct: 52, text: '正在加载机器学习模型' },
        { pct: 65, text: '正在验证隔离管理器' },
        { pct: 78, text: '正在编译 YARA 规则集' },
        { pct: 90, text: '正在初始化实时防护' },
        { pct: 100,text: '所有模块加载完成 - 防护已激活' },
      ];

      const logList = document.getElementById('log-list');
      const progressFill = document.getElementById('progress-fill');
      const progressPct = document.getElementById('progress-pct');
      const scanLine = document.querySelector('.splash-progress-scan-line');
      const scrollLog = document.getElementById('scroll-log');
      const footerTime = document.getElementById('footer-time');
      const statusText = document.querySelector('.splash-status-text');
      const footerLeft = document.getElementById('footer-left');

      function fmtTime() {
        const d = new Date();
        const p = function(n){ return String(n).padStart(2,'0'); };
        return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
      }

      let phaseIdx = 0;
      const CHECKED = [];
      // 已完成的日志项会在后续阶段保持展示；这里预填启动日志
      const logLines = [
        'PSLS 启动中',
        '加载核心依赖',
        '初始化安全引擎',
      ];
      logLines.forEach(t => appendLog('completed', t, true));
      appendLog('active', phases[0].text, false);

      function appendLog(cls, text, first) {
        const item = document.createElement('div');
        item.className = 'splash-log-item ' + (cls || '');
        const t = document.createElement('span');
        t.className = 'splash-log-time';
        t.textContent = fmtTime();
        const icon = document.createElement('span');
        icon.className = 'splash-log-icon';
        icon.innerHTML = cls === 'completed' ? CHECK : (cls === 'active' ? ACTIVE : PENDING);
        const path = document.createElement('span');
        path.className = 'splash-log-path';
        path.textContent = text;
        item.appendChild(t); item.appendChild(icon); item.appendChild(path);
        logList.appendChild(item);
        if (!first && scrollLog) scrollLog.scrollTop = scrollLog.scrollHeight;
      }

      function advance() {
        if (phaseIdx >= phases.length) {
          statusText.textContent = '所有模块加载完成 - 防护已激活';
          progressPct.textContent = '100%';
          footerLeft.textContent = 'PSLS V26.2.0beta · 内核防护已激活';
          return;
        }
        const phase = phases[phaseIdx];
        const pct = phase.pct;
        progressFill.style.width = pct + '%';
        scanLine.style.left = pct + '%';
        progressPct.textContent = pct + '%';
        statusText.textContent = phase.text;
        footerTime.textContent = fmtTime();

        // 更新日志列表：上一阶段 active → completed
        const items = logList.querySelectorAll('.splash-log-item');
        const lastAct = items[items.length - 1];
        if (lastAct && lastAct.className.indexOf('active') >= 0) {
          lastAct.className = 'splash-log-item completed';
          lastAct.querySelector('.splash-log-icon').innerHTML = CHECK;
        }
        // 追加当前阶段 active 项
        appendLog('active', phase.text, false);

        if (pct >= 100) return; // 停在 100%，由 Python 端关闭
        phaseIdx++;
        setTimeout(advance, 350 + Math.random() * 250);
      }

      setTimeout(advance, 400);
      setInterval(() => {
        footerTime.textContent = fmtTime();
        if (scrollLog) scrollLog.scrollTop = scrollLog.scrollHeight;
      }, 1000);
    </script>
</body>
</html>
